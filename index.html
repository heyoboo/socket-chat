<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e; --border: #2a2a2a; --text: #e8e8e8;
      --muted: #555; --self-bg: #1e1e1e; --other-bg: #141414;
      --green: #4ade80; --red: #f87171;
      --tr: background 0.2s, color 0.2s, border-color 0.2s;
    }
    :root.light {
      --bg: #f5f5f0; --border: #d8d6ce; --text: #1a1a1a;
      --muted: #999; --self-bg: #e8e6df; --other-bg: #eeede8;
      --green: #16a34a; --red: #dc2626;
    }

    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif; font-weight: 300;
      transition: var(--tr);
    }

    /* topbar */
    #topbar {
      position: fixed; top: 0; right: 0; z-index: 100;
      display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    }
    #online-badge {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem;
      letter-spacing: 0.08em; color: var(--muted);
    }
    #online-badge .count { color: var(--green); }
    #theme-toggle {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 5px 9px; cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    #theme-toggle:hover { color: var(--text); border-color: var(--text); }

    /* screens */
    .screen {
      display: none; height: 100%; flex-direction: column;
      align-items: center; justify-content: center; padding: 32px;
    }
    .screen.active { display: flex; }

    /* lobby */
    #lobby { gap: 20px; max-width: 320px; margin: 0 auto; width: 100%; }
    #lobby h1 {
      font-family: 'IBM Plex Mono', monospace; font-size: 1.05rem;
      font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--muted);
    }
    #lobby input {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid var(--border); padding: 12px 0;
      font-size: 1.15rem; font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 300; color: var(--text); outline: none;
      transition: border-color 0.2s;
    }
    #lobby input::placeholder { color: var(--muted); }
    #lobby input:focus { border-color: var(--text); }
    #find-btn {
      width: 100%; padding: 13px; background: var(--text); color: var(--bg);
      border: none; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem;
      letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer;
      transition: opacity 0.15s;
    }
    #find-btn:hover { opacity: 0.82; }
    #find-btn:disabled { opacity: 0.28; cursor: default; }

    /* waiting */
    #waiting { gap: 14px; text-align: center; }
    #waiting p {
      color: var(--muted); font-size: 0.88rem;
      font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.1em;
    }
    #cancel-wait-btn {
      background: transparent; border: none; font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); cursor: pointer; transition: color 0.15s; margin-top: 6px;
    }
    #cancel-wait-btn:hover { color: var(--red); }
    .dot-anim span { animation: blink 1.4s infinite both; color: var(--muted); }
    .dot-anim span:nth-child(2) { animation-delay: 0.2s; }
    .dot-anim span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

    /* chat */
    #chat-screen {
      display: none; height: 100%; flex-direction: column;
      max-width: 640px; margin: 0 auto; width: 100%;
    }
    #chat-screen.active { display: flex; }

    #chat-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green); flex-shrink: 0; transition: background 0.3s;
    }
    #partner-label {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.83rem;
      letter-spacing: 0.08em; color: var(--text);
    }
    #header-actions { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .hdr-btn {
      background: transparent; border: none; font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); cursor: pointer; transition: color 0.15s; padding: 2px 0;
    }
    .hdr-btn:hover { color: var(--text); }
    #skip-btn:hover { color: var(--red); }

    /* typing indicator */
    #typing-indicator {
      height: 20px; padding: 0 16px; flex-shrink: 0;
      font-family: 'IBM Plex Mono', monospace; font-size: 0.63rem;
      color: var(--muted); letter-spacing: 0.06em;
      display: flex; align-items: center; gap: 6px;
      opacity: 0; transition: opacity 0.2s;
    }
    #typing-indicator.show { opacity: 1; }
    .t-dot {
      width: 4px; height: 4px; border-radius: 50%; background: var(--muted);
      animation: tblink 1.2s infinite both;
    }
    .t-dot:nth-child(2){animation-delay:0.2s}
    .t-dot:nth-child(3){animation-delay:0.4s}
    @keyframes tblink{0%,80%,100%{opacity:0.2}40%{opacity:1}}

    /* messages */
    #messages {
      flex: 1; overflow-y: auto; padding: 14px 16px;
      display: flex; flex-direction: column; gap: 3px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .msg {
      max-width: 78%; padding: 9px 13px; font-size: 0.88rem;
      line-height: 1.5; animation: fadeUp 0.16s ease; word-break: break-word;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }
    .msg.self {
      align-self: flex-end; background: var(--self-bg);
      color: var(--text); border: 1px solid var(--border);
    }
    .msg.other {
      align-self: flex-start; background: var(--other-bg);
      color: var(--text); border: 1px solid transparent;
    }
    .msg .sender {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem;
      letter-spacing: 0.08em; color: var(--muted); margin-bottom: 3px;
    }
    .system-msg {
      align-self: center; font-family: 'IBM Plex Mono', monospace;
      font-size: 0.67rem; color: var(--muted); letter-spacing: 0.08em; padding: 5px 0;
    }

    /* input area */
    #input-area { flex-shrink: 0; border-top: 1px solid var(--border); }
    #input-row { display: flex; }
    #char-count {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem;
      color: var(--muted); padding: 3px 16px; text-align: right; letter-spacing: 0.05em;
    }
    #char-count.warn { color: var(--red); }
    #msg-input {
      flex: 1; background: transparent; border: none; padding: 16px;
      font-size: 0.93rem; font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 300; color: var(--text); outline: none; resize: none;
      min-height: 52px; max-height: 120px; line-height: 1.4;
    }
    #msg-input::placeholder { color: var(--muted); }
    #send-btn {
      padding: 0 20px; background: transparent; border: none;
      border-left: 1px solid var(--border); font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); cursor: pointer; transition: color 0.15s; flex-shrink: 0;
    }
    #send-btn:hover { color: var(--text); }
    #send-btn:disabled { opacity: 0.2; cursor: default; }

    /* next stranger */
    #next-btn {
      display: none; width: 100%; padding: 13px; background: transparent;
      border: 1px solid var(--border); font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--muted); cursor: pointer;
      transition: color 0.15s, border-color 0.15s; flex-shrink: 0;
    }
    #next-btn:hover { color: var(--text); border-color: var(--text); }
    #next-btn.visible { display: block; }

    @media (max-width: 480px) {
      #topbar { padding: 10px 12px; }
      #messages { padding: 12px; }
      #msg-input { padding: 14px 12px; }
      #chat-header { padding: 12px; }
    }
  </style>
</head>
<body>

<div id="topbar">
  <span id="online-badge"><span class="count" id="online-num">0</span> online</span>
  <button id="theme-toggle">light</button>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen active">
  <h1>anon chat</h1>
  <input id="name-input" type="text" placeholder="your name" maxlength="24" autocomplete="off"/>
  <button id="find-btn" disabled>find someone</button>
</div>

<!-- WAITING -->
<div id="waiting" class="screen">
  <p class="dot-anim">looking<span>.</span><span>.</span><span>.</span></p>
  <button id="cancel-wait-btn">cancel</button>
</div>

<!-- CHAT -->
<div id="chat-screen">
  <div id="chat-header">
    <div class="status-dot" id="status-dot"></div>
    <span id="partner-label">—</span>
    <div id="header-actions">
      <button class="hdr-btn" id="skip-btn">skip</button>
    </div>
  </div>

  <div id="typing-indicator">
    <div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>
    <span id="typing-name"></span>&nbsp;is typing
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="msg-input" placeholder="message…" maxlength="500" rows="1"></textarea>
      <button id="send-btn">send</button>
    </div>
    <div id="char-count">500</div>
  </div>

  <button id="next-btn">find new stranger</button>
</div>

<script>
  "use strict";
  const socket = io();

  // Request count once socket is confirmed connected
  socket.on("connect", () => socket.emit("get_online_count"));

  let myName = "", chatActive = false;
  let sendDelay = true, isTyping = false, typingTimer = null;

  // elements
  const lobbyEl    = document.getElementById("lobby");
  const waitingEl  = document.getElementById("waiting");
  const chatEl     = document.getElementById("chat-screen");
  const nameInput  = document.getElementById("name-input");
  const findBtn    = document.getElementById("find-btn");
  const cancelBtn  = document.getElementById("cancel-wait-btn");
  const msgInput   = document.getElementById("msg-input");
  const sendBtn    = document.getElementById("send-btn");
  const nextBtn    = document.getElementById("next-btn");
  const skipBtn    = document.getElementById("skip-btn");
  const messagesEl = document.getElementById("messages");
  const partnerLbl = document.getElementById("partner-label");
  const statusDot  = document.getElementById("status-dot");
  const typingEl   = document.getElementById("typing-indicator");
  const typingName = document.getElementById("typing-name");
  const charCount  = document.getElementById("char-count");
  const onlineNum  = document.getElementById("online-num");

  // ── Theme ──────────────────────────────────────────────────────
  const themeBtn = document.getElementById("theme-toggle");
  const root = document.documentElement;
  if ((localStorage.getItem("theme") || "dark") === "light") {
    root.classList.add("light"); themeBtn.textContent = "dark";
  }
  themeBtn.addEventListener("click", () => {
    const l = root.classList.toggle("light");
    themeBtn.textContent = l ? "dark" : "light";
    localStorage.setItem("theme", l ? "light" : "dark");
  });

  // ── Audio ──────────────────────────────────────────────────────
  const actx = new (window.AudioContext || window.webkitAudioContext)();
  function tone(freq, type, dur, vol) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type = type;
    o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  }
  function playSend()    { tone(880, "sine", 0.08, 0.1); }
  function playReceive() { tone(660, "sine", 0.1, 0.13); setTimeout(() => tone(880, "sine", 0.14, 0.1), 55); }
  document.addEventListener("click", () => { if (actx.state === "suspended") actx.resume(); }, { once: true });

  // ── Screen ─────────────────────────────────────────────────────
  function show(el) {
    [lobbyEl, waitingEl, chatEl].forEach(e => e.classList.remove("active"));
    el.classList.add("active");
  }

  // ── Lobby ──────────────────────────────────────────────────────
  nameInput.addEventListener("input", () => { findBtn.disabled = !nameInput.value.trim(); });
  nameInput.addEventListener("keydown", e => { if (e.key === "Enter") findBtn.click(); });
  findBtn.addEventListener("click", () => {
    const n = nameInput.value.trim(); if (!n) return;
    myName = n; socket.emit("find", n); show(waitingEl);
  });
  cancelBtn.addEventListener("click", () => show(lobbyEl));

  // ── Find new ───────────────────────────────────────────────────
  function findNew() {
    socket.emit("find", myName);
    nextBtn.classList.remove("visible");
    msgInput.disabled = false;
    sendBtn.disabled = false;
    statusDot.style.background = "var(--green)";
    chatActive = false;
    show(waitingEl);
  }
  skipBtn.addEventListener("click", findNew);
  nextBtn.addEventListener("click", findNew);

  // ── Socket events ───────────────────────────────────────────────
  socket.on("online_count", n => { onlineNum.textContent = n; });
  socket.on("waiting", () => show(waitingEl));

  socket.on("matched", name => {
    chatActive = true;
    partnerLbl.textContent = name;
    typingName.textContent = name;
    messagesEl.innerHTML = "";
    nextBtn.classList.remove("visible");
    msgInput.disabled = false;
    sendBtn.disabled = false;
    statusDot.style.background = "var(--green)";
    addSystem("connected — say hello");
    show(chatEl);
    msgInput.focus();
  });

  socket.on("receive", ({ text, from, self }) => {
    addMessage(text, from, self);
    if (!self) playReceive();
  });

  socket.on("typing", isT => typingEl.classList.toggle("show", isT));

  socket.on("partner_left", () => {
    chatActive = false;
    addSystem("stranger disconnected");
    statusDot.style.background = "var(--red)";
    msgInput.disabled = true;
    sendBtn.disabled = true;
    nextBtn.classList.add("visible");
    typingEl.classList.remove("show");
  });

  // ── Typing ─────────────────────────────────────────────────────
  msgInput.addEventListener("input", () => {
    msgInput.style.height = "auto";
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + "px";
    const r = 500 - msgInput.value.length;
    charCount.textContent = r;
    charCount.classList.toggle("warn", r < 50);
    if (!isTyping && chatActive) { isTyping = true; socket.emit("typing", true); }
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => { isTyping = false; socket.emit("typing", false); }, 1200);
  });

  // ── Send ───────────────────────────────────────────────────────
  function sendMessage() {
    const t = msgInput.value.trim();
    if (!t || !sendDelay || msgInput.disabled) return;
    sendDelay = false; setTimeout(() => sendDelay = true, 600);
    socket.emit("send", t);
    msgInput.value = ""; msgInput.style.height = "auto";
    charCount.textContent = "500"; charCount.classList.remove("warn");
    playSend(); isTyping = false; socket.emit("typing", false); clearTimeout(typingTimer);
  }
  sendBtn.addEventListener("click", sendMessage);
  msgInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Helpers ────────────────────────────────────────────────────
  function addMessage(text, from, self) {
    const d = document.createElement("div");
    d.className = "msg " + (self ? "self" : "other");
    d.innerHTML = `<div class="sender">${esc(from)}</div>${esc(text)}`;
    messagesEl.appendChild(d); messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function addSystem(text) {
    const d = document.createElement("div");
    d.className = "system-msg"; d.textContent = text;
    messagesEl.appendChild(d); messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
</script>
</body>
</html>
